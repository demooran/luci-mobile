name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release \
          --android-project-arg=android.injected.signing.store.file=${{ github.workspace }}/debug.keystore \
          --android-project-arg=android.injected.signing.store.password=android \
          --android-project-arg=android.injected.signing.key.alias=androiddebugkey \
          --android-project-arg=android.injected.signing.key.password=android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luci-mobile-release
          path: build/app/outputs/flutter-apk/app-release.apk
